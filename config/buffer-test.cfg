#####################################################################
#   Mellow buffer - HARDWARE TEST SUITE (uses the filament_buffer plugin)
#   BUFFER_TEST_HELP     list the tests and the order to run them
#   BUFFER_TEST_STATUS   plugin state + every sensor/button
#   BUFFER_TEST_TMC      read the TMC2208 over UART (proves the driver link)
#   BUFFER_TEST_LEDS     blink run LED then error LED
#   BUFFER_TEST_SYNC     sync + unsync cycle (no motion; toolhead must be idle)
#   BUFFER_TEST_MOTOR    short slow move out and back (NO filament loaded)
#   BUFFER_LOAD          (plugin command) feed to the extruder, stop at pos2;
#                        also runs by itself when filament is inserted
#   BUFFER_CALIBRATE     (plugin command) measure the true rotation_distance
#   BUFFER_TEST_EXTRUDE  (plugin command) automated synced-extrusion test:
#                        filament loaded to the nozzle, homed, nozzle >= 20 mm
#                        over a cup (or CHECK_Z=0), hotend hot or TEMP=.
#                        DRY_RUN=1 to preview.
#   Sensor/button changes are printed live as "buffer: ..." while
#   report_events is on (BUFFER_SET REPORT_EVENTS=0|1).
#   Offline control-law tests: tests/ in this repo (python -m unittest)
#####################################################################

[gcode_macro BUFFER_TEST_HELP]
description: List the buffer tests in the order to run them
gcode:
    RESPOND PREFIX="buffer:" MSG="1) BUFFER_TEST_STATUS - all inputs at rest (no filament, buffer at rest)"
    RESPOND PREFIX="buffer:" MSG="2) Sensors: insert filament, slide the buffer to each end, press each button - every change prints a line"
    RESPOND PREFIX="buffer:" MSG="3) BUFFER_TEST_TMC - driver must answer (no 'Unable to read' errors)"
    RESPOND PREFIX="buffer:" MSG="4) BUFFER_TEST_LEDS - run LED then error LED"
    RESPOND PREFIX="buffer:" MSG="5) BUFFER_TEST_SYNC - sync/unsync with the toolhead idle"
    RESPOND PREFIX="buffer:" MSG="6) Remove filament, then BUFFER_TEST_MOTOR - first move must be FEED"
    RESPOND PREFIX="buffer:" MSG="7) Insert filament at the inlet: it loads to the extruder by itself and stops at pos2"
    RESPOND PREFIX="buffer:" MSG="8) Heat, extrude until it comes out of the nozzle, then BUFFER_CALIBRATE and put the printed rotation_distance in the config"
    RESPOND PREFIX="buffer:" MSG="9) Nozzle over a cup, then BUFFER_TEST_EXTRUDE TEMP=<material temp> (DRY_RUN=1 previews, CHECK_Z=0 if not homed)"

[gcode_macro BUFFER_TEST_STATUS]
description: Report the filament buffer plugin state and every sensor
gcode:
    BUFFER_STATUS

[gcode_macro BUFFER_TEST_TMC]
description: Read the buffer TMC2208 registers over UART
gcode:
    ##  Kalico registers TMC commands under the last word of the section name
    DUMP_TMC STEPPER=buffer

[gcode_macro BUFFER_TEST_LEDS]
description: Blink the buffer run LED, then the error LED
gcode:
    RESPOND PREFIX="buffer:" MSG="run LED (PA8, blue) on for 2 s"
    SET_PIN PIN=buffer_led_run VALUE=1
    G4 P2000
    SET_PIN PIN=buffer_led_run VALUE=0
    M400
    RESPOND PREFIX="buffer:" MSG="error LED (PA15, red) on for 2 s"
    SET_PIN PIN=buffer_led_err VALUE=1
    G4 P2000
    SET_PIN PIN=buffer_led_err VALUE=0
    M400
    RESPOND PREFIX="buffer:" MSG="LED test done (the plugin restores its LED states on the next change)"

[gcode_macro BUFFER_TEST_SYNC]
description: Sync and unsync the buffer motor with the toolhead idle (no motion)
gcode:
    {% if printer.print_stats.state in ["printing", "paused"] %}
        { action_raise_error("BUFFER_TEST_SYNC: not during a print") }
    {% endif %}
    M400
    BUFFER_SYNC
    BUFFER_STATUS
    BUFFER_UNSYNC
    BUFFER_STATUS

[gcode_macro BUFFER_TEST_MOTOR]
description: Short slow buffer motor move out and back. Requires NO filament. DIST<=50 mm, SPEED<=30 mm/s
gcode:
    {% set dist = params.DIST|default(20)|float %}
    {% set speed = params.SPEED|default(10)|float %}
    {% if printer.print_stats.state in ["printing", "paused"] %}
        { action_raise_error("BUFFER_TEST_MOTOR: not allowed during a print") }
    {% endif %}
    {% if printer.filament_buffer.inlet %}
        { action_raise_error("BUFFER_TEST_MOTOR: filament detected - remove the filament from the buffer first") }
    {% endif %}
    {% if dist <= 0 or dist > 50 or speed <= 0 or speed > 30 %}
        { action_raise_error("BUFFER_TEST_MOTOR: limits are 0 < DIST <= 50, 0 < SPEED <= 30") }
    {% endif %}
    RESPOND PREFIX="buffer:" MSG="motor +{dist} mm at {speed} mm/s - should be FEED (toward the toolhead)"
    BUFFER_MOVE DIST={dist} SPEED={speed}
    M400
    G4 P1000
    RESPOND PREFIX="buffer:" MSG="motor -{dist} mm - should be RETRACT"
    BUFFER_MOVE DIST=-{dist} SPEED={speed}
    M400
    RESPOND PREFIX="buffer:" MSG="motor test done"
