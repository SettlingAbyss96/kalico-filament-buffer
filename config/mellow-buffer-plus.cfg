#####################################################################
#   Example: Mellow Fly LLL Buffer Plus as a Kalico MCU + filament_buffer
#   Convert the buffer first: docs/mellow-buffer-plus.md
#   Copy into your printer config and [include] it from printer.cfg.
#
#   CRITICAL MCU on purpose: if the buffer disconnects, the printer shuts
#   down instead of printing for hours with an unfed filament path.
#
#   Don't call SYNC_EXTRUDER_MOTION / SET_EXTRUDER_ROTATION_DISTANCE on
#   'buffer' yourself - they stop the toolhead. Use BUFFER_SYNC/UNSYNC.
#####################################################################

[mcu buffer]
##  ls /dev/serial/by-id/  -> usb-Klipper_stm32f072xb_<id>-if00
serial: /dev/serial/by-id/usb-Klipper_stm32f072xb_REPLACE_WITH_YOUR_ID-if00
restart_method: command

[temperature_sensor Buffer]
sensor_type: temperature_mcu
sensor_mcu: buffer
min_temp: 0
max_temp: 100

##  Buffer motor. Starts UNSYNCED (empty extruder:); BUFFER_SYNC syncs it.
##  6.30 mm per motor turn, measured against the extruder on a Voron 2.4.
##  Run BUFFER_CALIBRATE once filament is loaded to measure your own.
[extruder_stepper buffer]
extruder:
step_pin: buffer:PC13
dir_pin: buffer:PA7
enable_pin: !buffer:PA6
microsteps: 16
rotation_distance: 6.300

##  The driver is a TMC2208 (IOIN version 0x20)
[tmc2208 extruder_stepper buffer]
uart_pin: buffer:PB1
run_current: 0.5
sense_resistor: 0.110
stealthchop_threshold: 0

##  LEDs, driven by the plugin: blue = filament present, red = fault
[output_pin buffer_led_run]
pin: buffer:PA8
value: 0
shutdown_value: 0

[output_pin buffer_led_err]
pin: buffer:PA15
value: 0
shutdown_value: 0

[filament_buffer]
extruder_stepper: buffer
extruder: extruder
##  Slider Hall sensors (high = blocked): pos1 rest end, pos2 target, pos3 compressed
pos1_pin: buffer:PB4
pos2_pin: buffer:PB3
pos3_pin: buffer:PB2
##  Inlet filament switch (low = filament present)
inlet_pin: !buffer:PB7
##  Buttons (low = pressed) - only work when not printing
feed_button_pin: !buffer:PB12
retract_button_pin: !buffer:PB13
ok_led: buffer_led_run
fault_led: buffer_led_err
##  Print every sensor/button change to the console while commissioning
report_events: True
##  Inserting filament loads it to the extruder by itself (stops at pos2)
#autoload: True
#load_speed: 30
#load_max_mm: 1500
##  All options with defaults: README.md
